<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5EFDF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121812" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" />
    <title>Khet Saathi — खेत साथी</title>
    <!-- Apply the saved theme (auto/light/dark) before first paint, so a forced
         theme doesn't flash the system one. App.jsx keeps it in sync. -->
    <script>
      try { var t = localStorage.getItem("ks-theme"); document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "auto"; }
      catch (e) { document.documentElement.dataset.theme = "auto"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
